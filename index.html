const { useState, useEffect, useRef } = React;

const SAMPLE_CATEGORIES = ['Reativos & Químicos', 'Bombas & Dosadores', 'Instrumentação & Sensores', 'Filtros & Membranas', 'EPIs & Segurança'];
const SAMPLE_SECTORS = ['ETE - Tanque de Neutralização', 'ETE - Decantador Primário', 'ETA - Estação de Água', 'Laboratório de Análises', 'Almoxarifado Central'];

/* ============================================================
   SQLite (sql.js) + IndexedDB — persistência local robusta
   ============================================================ */
const IDB_NAME = 'PopTimeProSQLite';
const IDB_STORE = 'sqlite';
const IDB_KEY = 'db';

let _sqlDb = null;
let _SQL = null;
let _dbReady = false;
let _saveTimer = null;

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbLoad() {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.get(IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('IndexedDB load falhou:', e);
    return null;
  }
}

async function idbSave(uint8) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      const req = store.put(uint8, IDB_KEY);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('IndexedDB save falhou:', e);
  }
}

function createSchema(db) {
  db.exec(`
    CREATE TABLE IF NOT EXISTS settings (
      key TEXT PRIMARY KEY,
      value TEXT
    );
    CREATE TABLE IF NOT EXISTS categories (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      name TEXT UNIQUE NOT NULL
    );
    CREATE TABLE IF NOT EXISTS sectors (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      name TEXT UNIQUE NOT NULL
    );
    CREATE TABLE IF NOT EXISTS stock_items (
      id TEXT PRIMARY KEY,
      data TEXT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS history_logs (
      id TEXT PRIMARY KEY,
      data TEXT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS non_conformities (
      id TEXT PRIMARY KEY,
      data TEXT NOT NULL
    );
  `);
}

function persistDbSoon() {
  if (!_sqlDb) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      const data = _sqlDb.export();
      await idbSave(data);
    } catch (e) {
      console.error('Erro ao persistir SQLite:', e);
    }
  }, 400);
}

async function initSqlite() {
  if (_dbReady && _sqlDb) return _sqlDb;
  try {
    _SQL = await initSqlJs({
      locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    });
    const saved = await idbLoad();
    if (saved && saved.length) {
      _sqlDb = new _SQL.Database(new Uint8Array(saved));
    } else {
      _sqlDb = new _SQL.Database();
      createSchema(_sqlDb);
      // Migração automática do localStorage antigo (se existir)
      migrateFromLocalStorage(_sqlDb);
      persistDbSoon();
    }
    createSchema(_sqlDb); // garante schema mesmo em DBs antigos
    _dbReady = true;
    return _sqlDb;
  } catch (e) {
    console.error('Falha ao iniciar SQLite:', e);
    // Fallback em memória
    if (_SQL) {
      _sqlDb = new _SQL.Database();
      createSchema(_sqlDb);
      _dbReady = true;
    }
    return _sqlDb;
  }
}

function migrateFromLocalStorage(db) {
  try {
    const cats = localStorage.getItem('poptime_ind_categories');
    const secs = localStorage.getItem('poptime_ind_sectors');
    const stock = localStorage.getItem('poptime_ind_stock');
    const hist = localStorage.getItem('poptime_ind_history');
    const nc = localStorage.getItem('poptime_ind_nonconform');
    const admin = localStorage.getItem('poptime_ind_admin_name');
    const company = localStorage.getItem('poptime_ind_company_name');

    if (admin) db.run('INSERT OR REPLACE INTO settings (key, value) VALUES (?, ?)', ['adminName', admin]);
    if (company) db.run('INSERT OR REPLACE INTO settings (key, value) VALUES (?, ?)', ['companyName', company]);

    if (cats) {
      const arr = JSON.parse(cats);
      arr.forEach(name => {
        try { db.run('INSERT OR IGNORE INTO categories (name) VALUES (?)', [name]); } catch (_) {}
      });
    }
    if (secs) {
      const arr = JSON.parse(secs);
      arr.forEach(name => {
        try { db.run('INSERT OR IGNORE INTO sectors (name) VALUES (?)', [name]); } catch (_) {}
      });
    }
    if (stock) {
      const arr = JSON.parse(stock);
      arr.forEach(item => {
        try { db.run('INSERT OR REPLACE INTO stock_items (id, data) VALUES (?, ?)', [item.id, JSON.stringify(item)]); } catch (_) {}
      });
    }
    if (hist) {
      const arr = JSON.parse(hist);
      arr.forEach(log => {
        try { db.run('INSERT OR REPLACE INTO history_logs (id, data) VALUES (?, ?)', [log.id, JSON.stringify(log)]); } catch (_) {}
      });
    }
    if (nc) {
      const arr = JSON.parse(nc);
      arr.forEach(n => {
        try { db.run('INSERT OR REPLACE INTO non_conformities (id, data) VALUES (?, ?)', [n.id, JSON.stringify(n)]); } catch (_) {}
      });
    }
  } catch (e) {
    console.warn('Migração localStorage → SQLite falhou (ignorado):', e);
  }
}

function sqliteGetSetting(key, fallback = '') {
  if (!_sqlDb) return fallback;
  try {
    const stmt = _sqlDb.prepare('SELECT value FROM settings WHERE key = ?');
    stmt.bind([key]);
    if (stmt.step()) {
      const row = stmt.getAsObject();
      stmt.free();
      return row.value != null ? row.value : fallback;
    }
    stmt.free();
  } catch (_) {}
  return fallback;
}

function sqliteSetSetting(key, value) {
  if (!_sqlDb) return;
  _sqlDb.run('INSERT OR REPLACE INTO settings (key, value) VALUES (?, ?)', [key, value]);
  persistDbSoon();
}

function sqliteLoadList(table) {
  if (!_sqlDb) return [];
  try {
    const res = _sqlDb.exec(`SELECT data FROM ${table}`);
    if (!res.length) return [];
    const items = res[0].values.map(row => JSON.parse(row[0]));
    // Histórico e NC: mais recentes primeiro
    if (table === 'history_logs' || table === 'non_conformities') {
      items.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
    }
    return items;
  } catch (_) {
    return [];
  }
}

function sqliteSaveList(table, items) {
  if (!_sqlDb) return;
  _sqlDb.run(`DELETE FROM ${table}`);
  const stmt = _sqlDb.prepare(`INSERT INTO ${table} (id, data) VALUES (?, ?)`);
  items.forEach(item => {
    stmt.run([item.id, JSON.stringify(item)]);
  });
  stmt.free();
  persistDbSoon();
}

function sqliteLoadNames(table) {
  if (!_sqlDb) return [];
  try {
    const res = _sqlDb.exec(`SELECT name FROM ${table} ORDER BY id`);
    if (!res.length) return [];
    return res[0].values.map(r => r[0]);
  } catch (_) {
    return [];
  }
}

function sqliteSaveNames(table, names) {
  if (!_sqlDb) return;
  _sqlDb.run(`DELETE FROM ${table}`);
  const stmt = _sqlDb.prepare(`INSERT INTO ${table} (name) VALUES (?)`);
  names.forEach(n => stmt.run([n]));
  stmt.free();
  persistDbSoon();
}

function sqliteClearAll() {
  if (!_sqlDb) return;
  ['settings', 'categories', 'sectors', 'stock_items', 'history_logs', 'non_conformities'].forEach(t => {
    try { _sqlDb.run(`DELETE FROM ${t}`); } catch (_) {}
  });
  persistDbSoon();
}

function formatDateTime(isoString) {
if (!isoString) return '--/--/---- --:--';
const date = new Date(isoString);
if (isNaN(date.getTime())) return '--/--/---- --:--';
return date.toLocaleString('pt-BR', {
day: '2-digit',
month: '2-digit',
year: 'numeric',
hour: '2-digit',
minute: '2-digit'
});
}

function formatDateShort(isoString) {
if (!isoString) return '';
const date = new Date(isoString);
if (isNaN(date.getTime())) return '';
return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function getItemStatus(validityIso, quantity = 1, minQuantity = 0) {
if (quantity <= 0) {
return { code: 'EXHAUSTED', label: 'SEM ESTOQUE (ZERADO)', color: 'bg-slate-700 text-slate-300 border-slate-600' };
}
if (!validityIso) return { code: 'VALID', label: 'OPERACIONAL', color: 'bg-emerald-600 text-white' };
const now = new Date();
const valDate = new Date(validityIso);
const diffHours = (valDate - now) / (1000 * 60 * 60);
if (diffHours < 0) {
return { code: 'EXPIRED', label: 'REVISÃO / VALIDADE VENCIDA', color: 'bg-red-600 text-white border-red-700' };
} else if (diffHours <= 72) {
return { code: 'URGENT', label: 'PRÓXIMO DO PRAZO (≤ 72h)', color: 'bg-amber-500 text-slate-950 border-amber-600 font-bold' };
} else if (minQuantity > 0 && quantity <= minQuantity) {
return { code: 'LOW_STOCK', label: 'ESTOQUE CRÍTICO (≤ MÍNIMO)', color: 'bg-orange-600 text-white border-orange-700 font-bold' };
} else {
return { code: 'VALID', label: 'EM CONFORMIDADE', color: 'bg-emerald-600 text-white border-emerald-700' };
}
}

function getQrCodeUrl(dataString) {
return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(dataString)}`;
}

// Inicialização SQLite (carrega dados + migra localStorage se necessário)
useEffect(() => {
  let cancelled = false;
  (async () => {
    await initSqlite();
    if (cancelled) return;
    const cats = sqliteLoadNames('categories');
    const secs = sqliteLoadNames('sectors');
    const stock = sqliteLoadList('stock_items');
    const hist = sqliteLoadList('history_logs');
    const ncs = sqliteLoadList('non_conformities');
    const adm = sqliteGetSetting('adminName', 'Eng. Supervisora');
    const comp = sqliteGetSetting('companyName', 'Tratamento de Efluentes & Qualidade');
    if (cats.length) setCategories(cats);
    else {
      sqliteSaveNames('categories', SAMPLE_CATEGORIES);
      setCategories(SAMPLE_CATEGORIES);
    }
    if (secs.length) setSectors(secs);
    else {
      sqliteSaveNames('sectors', SAMPLE_SECTORS);
      setSectors(SAMPLE_SECTORS);
    }
    setStockItems(stock);
    setHistoryLogs(hist);
    setNonConformities(ncs);
    setAdminName(adm);
    setCompanyName(comp);
    setDbReady(true);
    // permite saves após o primeiro ciclo de render
    setTimeout(() => { skipFirstSave.current = false; }, 600);
  })();
  return () => { cancelled = true; };
}, []);

// Persistência SQLite (debounced via persistDbSoon)
useEffect(() => {
  if (!dbReady || skipFirstSave.current) return;
  sqliteSaveNames('categories', categories);
}, [categories, dbReady]);
useEffect(() => {
  if (!dbReady || skipFirstSave.current) return;
  sqliteSaveNames('sectors', sectors);
}, [sectors, dbReady]);
useEffect(() => {
  if (!dbReady || skipFirstSave.current) return;
  sqliteSaveList('stock_items', stockItems);
}, [stockItems, dbReady]);
useEffect(() => {
  if (!dbReady || skipFirstSave.current) return;
  sqliteSaveList('history_logs', historyLogs);
}, [historyLogs, dbReady]);
useEffect(() => {

  sqliteSaveList('non_conformities', nonConformities);
}, [nonConformities, dbReady]);

addHistoryLog('EDIÇÃO', updatedItem, `Dados alterados via edição direta. Saldo: ${updatedQty} un | Mín: ${updatedMinQty} un.`);

});
setEditModalItem(null);
setScannedResult(null);

const handleProcessAction = () => {
if (!actionModalItem) return;
const qtyMove = Math.max(1, parseInt(movementQty) || 1);
let updatedItem = null;
if (movementType === 'SAIDA') {
const currentQty = parseInt(actionModalItem.quantity) || 0;
const newQty = Math.max(0, currentQty - qtyMove);
setStockItems(prev => prev.map(s => {
if (s.id === actionModalItem.id) {
updatedItem = {
...s,
quantity: newQty,
status: newQty === 0 ? 'EXHAUSTED' : 'ACTIVE',
lastActionAt: new Date().toISOString(),
lastActionNotes: actionNotes
};
return updatedItem;
}
return s;
}));
addHistoryLog('SAÍDA', actionModalItem, `Saída de ${qtyMove} un. Saldo atual: ${newQty} un. Obs: ${actionNotes || 'Nenhuma'}`, -qtyMove);
setModalMessage({
type: 'info',
title: 'Saída Registrada',
text: `Baixa de ${qtyMove} un. para "${actionModalItem.productName}". Saldo atual: ${newQty}.`
});
} else if (movementType === 'ENTRADA') {
const currentQty = parseInt(actionModalItem.quantity) || 0;
const newQty = currentQty + qtyMove;
setStockItems(prev => prev.map(s => {
if (s.id === actionModalItem.id) {
updatedItem = {
...s,
quantity: newQty,
status: 'ACTIVE',
lastActionAt: new Date().toISOString(),
lastActionNotes: actionNotes
};
return updatedItem;
}
return s;
}));
addHistoryLog('ENTRADA', actionModalItem, `Entrada de ${qtyMove} un. Saldo total: ${newQty} un. Obs: ${actionNotes || 'Nenhuma'}`, qtyMove);
setModalMessage({
type: 'success',
title: 'Entrada Adicionada',
text: `Adicionadas ${qtyMove} un. ao estoque de "${actionModalItem.productName}". Novo saldo: ${newQty}.`
});
}
setActionModalItem(null);
setMovementQty(1);
setActionNotes('');
setScannedResult(null);
};

const matchName = (item.productName || '').toLowerCase().includes(term);
const matchTag = (item.serialOrTag || '').toLowerCase().includes(term);
const matchBatch = (item.batchNumber || '').toLowerCase().includes(term);
const matchId = (item.id || '').toLowerCase().includes(term);
const matchCategory = (item.category || '').toLowerCase().includes(term);
const matchSector = (item.sector || '').toLowerCase().includes(term);
if (!matchName && !matchTag && !matchBatch && !matchId && !matchCategory && !matchSector) {
return false;
}
}
if (stockCategoryFilter && item.category !== stockCategoryFilter) return false;
if (stockSectorFilter && item.sector !== stockSectorFilter) return false;
if (stockStatusFilter !== 'ALL') {
const statusObj = getItemStatus(item.validityDate, item.quantity, item.minQuantity || 0);
if (stockStatusFilter === 'LOW_STOCK') {
if (qty <= 0 || qty > (item.minQuantity || 0)) return false;

return false;
}
}
return true;
});

const matchOperator = (log.operator || '').toLowerCase().includes(term);
const matchDetails = (log.details || '').toLowerCase().includes(term);
if (!matchName && !matchId && !matchOperator && !matchDetails) return false;
}
if (historyTypeFilter !== 'ALL' && log.type !== historyTypeFilter) return false;
if (historyDateStart) {
const logTime = new Date(log.timestamp).getTime();
const startTime = new Date(historyDateStart).getTime();
if (logTime < startTime) return false;
}
if (historyDateEnd) {
const logTime = new Date(log.timestamp).getTime();
const endTime = new Date(historyDateEnd + 'T23:59:59').getTime();
if (logTime > endTime) return false;
}
return true;
});

const fileReader = new FileReader();
if (event.target.files && event.target.files[0]) {
fileReader.readAsText(event.target.files[0], "UTF-8");
fileReader.onload = (e) => {
try {
const parsed = JSON.parse(e.target.result);
if (parsed.stockItems) setStockItems(parsed.stockItems);
if (parsed.categories) setCategories(parsed.categories);
if (parsed.sectors) setSectors(parsed.sectors);
if (parsed.historyLogs) setHistoryLogs(parsed.historyLogs);

if (parsed.companyName) setCompanyName(parsed.companyName);
setModalMessage({ type: 'success', title: 'Restauração Concluída', text: 'Seus dados foram importados com sucesso!' });
} catch (err) {
setModalMessage({ type: 'error', title: 'Arquivo Inválido', text: 'O arquivo JSON selecionado não é compatível.' });
}
};
}
};

function IndustrialQrScannerComponent({ onScanSuccess }) {
  const [isCameraActive, setIsCameraActive] = useState(false);
  const [cameraError, setCameraError] = useState(null);
  const [isStarting, setIsStarting] = useState(false);
  const [permissionState, setPermissionState] = useState('unknown'); // granted | denied | prompt | unknown
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const lastScanRef = useRef('');
  const lastScanTimeRef = useRef(0);
  const runningRef = useRef(false);
  const barcodeDetectorRef = useRef(null);

  const stopTracks = () => {
    if (streamRef.current) {
      try {
        streamRef.current.getTracks().forEach(t => {
          try { t.stop(); } catch (_) {}
        });
      } catch (_) {}
      streamRef.current = null;
    }
    if (videoRef.current) {
      try { videoRef.current.srcObject = null; } catch (_) {}
    }
  };

  const stopCamera = React.useCallback(() => {
    runningRef.current = false;
    if (rafRef.current) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
    stopTracks();
    setIsCameraActive(false);
    setIsStarting(false);
  }, []);

  useEffect(() => {
    return () => { stopCamera(); };
  }, [stopCamera]);

  // Consulta status de permissão (Chrome/Android) sem bloquear
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const status = await navigator.permissions.query({ name: 'camera' });
          if (!cancelled) setPermissionState(status.state || 'unknown');
          status.onchange = () => {
            if (!cancelled) setPermissionState(status.state || 'unknown');
          };
        }
      } catch (_) {
        // Safari e alguns browsers não suportam permissions.query('camera')
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const handleDecoded = (text) => {
    if (!text || !runningRef.current) return;
    const now = Date.now();
    if (text === lastScanRef.current && (now - lastScanTimeRef.current) < 2000) return;
    lastScanRef.current = text;
    lastScanTimeRef.current = now;
    runningRef.current = false;
    onScanSuccess(text);
    stopCamera();
  };

  const scanFrame = () => {
    if (!runningRef.current) return;
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas || video.readyState < 2) {
      rafRef.current = requestAnimationFrame(scanFrame);
      return;
    }
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) {
      rafRef.current = requestAnimationFrame(scanFrame);
      return;
    }
    // limita resolução do canvas para performance em mobile
    const maxSide = 480;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const cw = Math.floor(w * scale);
    const ch = Math.floor(h * scale);
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, cw, ch);

    const finishLoop = () => {
      if (runningRef.current) rafRef.current = requestAnimationFrame(scanFrame);
    };

    // 1) BarcodeDetector nativo (Chrome Android / alguns Chromium)
    if (barcodeDetectorRef.current) {
      barcodeDetectorRef.current.detect(canvas).then(codes => {
        if (codes && codes.length) {
          const raw = codes[0].rawValue || codes[0].data || '';
          if (raw) {
            handleDecoded(String(raw));
            return;
          }
        }
        // 2) jsQR fallback no mesmo frame
        tryDecodeJsQR(ctx, cw, ch);
        finishLoop();
      }).catch(() => {
        tryDecodeJsQR(ctx, cw, ch);
        finishLoop();
      });
      return;
    }

    tryDecodeJsQR(ctx, cw, ch);
    finishLoop();
  };

  const tryDecodeJsQR = (ctx, cw, ch) => {
    if (typeof jsQR === 'undefined') return;
    try {
      const imageData = ctx.getImageData(0, 0, cw, ch);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'attemptBoth'
      });
      if (code && code.data) handleDecoded(code.data);
    } catch (_) {}
  };

  const getRearStream = async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const err = new Error('mediaDevices_unavailable');
      err.name = 'NotSupportedError';
      throw err;
    }

    // Lista de constraints — só traseira. Do mais específico ao mais permissivo.
    const constraintList = [
      { audio: false, video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: { exact: 'environment' } } },
      { audio: false, video: { facingMode: 'environment' } },
    ];

    // Tenta deviceId de câmeras traseiras se enumerateDevices estiver disponível
    try {
      // precisa de permissão prévia para labels; se já tiver, filtra
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videos = devices.filter(d => d.kind === 'videoinput');
      const rear = videos.filter(d => {
        const l = (d.label || '').toLowerCase();
        if (!l) return false;
        if (/front|user|selfie|facetime|frontal|dianteira/.test(l)) return false;
        return /back|rear|traseira|environment|posterior|world|facing back/.test(l);
      });
      rear.forEach(d => {
        constraintList.push({ audio: false, video: { deviceId: { exact: d.deviceId } } });
        constraintList.push({ audio: false, video: { deviceId: d.deviceId } });
      });
      // mobile multi-câmera sem label: tenta a última
      if (!rear.length && videos.length > 1) {
        const last = videos[videos.length - 1];
        if (last.deviceId) {
          constraintList.push({ audio: false, video: { deviceId: { exact: last.deviceId } } });
        }
      }
    } catch (_) {}

    let lastErr = null;
    for (const constraints of constraintList) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        return stream;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('camera_open_failed');
  };

  const startCamera = async () => {
    if (runningRef.current || isStarting) return;

    setCameraError(null);
    setIsStarting(true);

    const proto = (location && location.protocol) || '';
    if (proto === 'content:' || proto === 'file:' || !window.isSecureContext) {
      const host = (location && location.hostname) || '';
      const isLan = /^\d+\.\d+\.\d+\.\d+$/.test(host);
      let msg;
      if (proto === 'content:') {
        msg = 'Você abriu o app por content:// (arquivo local no Android). Nesse modo o navegador bloqueia a câmera por segurança. Publique o HTML em um site HTTPS (ex.: Netlify, GitHub Pages, Vercel) e abra pelo link https://…';
      } else if (proto === 'file:') {
        msg = 'Você abriu o arquivo HTML direto do celular (file://). A câmera não funciona assim. Hospede em HTTPS e abra pelo link https://…';
      } else if (isLan) {
        msg = 'Endereço HTTP por IP local: a câmera fica bloqueada. Use HTTPS ou localhost.';
      } else {
        msg = 'Abra este app em HTTPS ou localhost. A câmera não funciona em content://, file:// ou http:// comum.';
      }
      setCameraError(msg);
      setIsStarting(false);
      return;
    }

    try {
      // Para qualquer stream antigo
      stopTracks();

      const stream = await getRearStream();
      streamRef.current = stream;
      setPermissionState('granted');

      setIsCameraActive(true);
      setIsStarting(false);

      // espera o video montar no DOM
      await new Promise(r => setTimeout(r, 100));

      const video = videoRef.current;
      if (!video) {
        throw new Error('video_element_missing');
      }

      video.setAttribute('playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.muted = true;
      video.srcObject = stream;

      await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('video_timeout')), 8000);
        video.onloadedmetadata = () => {
          clearTimeout(t);
          video.play().then(resolve).catch(reject);
        };
      });

      // BarcodeDetector se existir
      try {
        if (typeof BarcodeDetector !== 'undefined') {
          const formats = ['qr_code'];
          barcodeDetectorRef.current = new BarcodeDetector({ formats });
        }
      } catch (_) {
        barcodeDetectorRef.current = null;
      }

      runningRef.current = true;
      rafRef.current = requestAnimationFrame(scanFrame);
    } catch (err) {
      console.error('[QR] startCamera:', err);
      stopTracks();
      setIsCameraActive(false);
      setIsStarting(false);
      runningRef.current = false;

      const name = err && err.name ? err.name : '';
      const msg = String(err && (err.message || err));

      if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || /NotAllowed|Permission|denied/i.test(msg)) {
        setPermissionState('denied');
        setCameraError(
          'Permissão de câmera bloqueada neste navegador. ' +
          'Vá em Configurações do site → Câmera → Permitir, depois toque em Tentar novamente. ' +
          'No Android (Chrome): ícone de cadeado/info na barra de endereço → Permissões → Câmera → Permitir. ' +
          'No iPhone (Safari): Ajustes → Safari → Câmera → Permitir.'
        );
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        setCameraError('Nenhuma câmera traseira foi encontrada neste aparelho.');
      } else if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') {
        setCameraError('A câmera está em uso por outro aplicativo. Feche a câmera nativa, WhatsApp e similares, aguarde 3 segundos e tente de novo.');
      } else if (name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError') {
        setCameraError('Não foi possível selecionar a câmera traseira. Toque em Tentar novamente.');
      } else if (name === 'NotSupportedError' || /mediaDevices_unavailable/i.test(msg)) {
        setCameraError('Este navegador não oferece acesso à câmera. Use Chrome, Safari ou Edge atualizado.');
      } else if (!window.isSecureContext) {
        setCameraError('Contexto inseguro. Use HTTPS ou localhost.');
      } else {
        setCameraError('Não foi possível abrir a câmera traseira. Toque em Tentar novamente. (' + (name || msg).toString().substring(0, 80) + ')');
      }
    }
  };

  return (
    <div className="space-y-3">
      {cameraError && (
        <div className="bg-red-950/80 border border-red-700 text-red-200 text-xs rounded-xl p-3 flex items-start gap-2">
          <i className="fa-solid fa-circle-exclamation mt-0.5 shrink-0"></i>
          <div className="flex-1">
            <p className="font-bold">Problema com a câmera</p>
            <p className="mt-1 text-red-300/90 leading-relaxed">{cameraError}</p>
            <button
              type="button"
              onClick={() => { setCameraError(null); startCamera(); }}
              className="mt-2 text-cyan-400 font-bold underline"
            >
              Tentar novamente
            </button>
          </div>
        </div>
      )}

      {!isCameraActive ? (
        <div className="space-y-2">
          <button
            type="button"
            onClick={startCamera}
            disabled={isStarting}
            className="w-full py-4 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs hover:bg-cyan-400 flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 disabled:opacity-60"
          >
            {isStarting ? (
              <><i className="fa-solid fa-spinner fa-spin"></i> Abrindo câmera traseira...</>
            ) : (
              <><i className="fa-solid fa-camera"></i> Ativar Câmera Traseira</>
            )}
          </button>
          {permissionState === 'denied' && !cameraError && (
            <p className="text-[10px] text-amber-400 text-center">
              Permissão de câmera está bloqueada nas configurações do navegador.
            </p>
          )}
        </div>
      ) : (
        <div className="space-y-2">
          <div className="relative rounded-xl overflow-hidden border border-cyan-500/50 bg-slate-950 min-h-[280px] flex items-center justify-center">
            <video
              ref={videoRef}
              playsInline
              muted
              autoPlay
              className="w-full max-h-[360px] object-cover rounded-xl"
              style={{ transform: 'scaleX(1)' }}
            />
            <canvas ref={canvasRef} className="hidden" />
            <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
              <div className="w-[70%] max-w-[240px] aspect-square border-2 border-cyan-400/80 rounded-xl shadow-[0_0_0_9999px_rgba(2,6,23,0.45)]" />
            </div>
          </div>
          <p className="text-[10px] text-slate-500 text-center">
            Aponte a câmera traseira para o QR da etiqueta. A leitura para automaticamente.
          </p>
          <button
            type="button"
            onClick={stopCamera}
            className="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs hover:bg-slate-700 border border-slate-700"
          >
            Parar Câmera
          </button>
        </div>
      )}
    </div>
  );
}


const rootElement = document.getElementById('root');
if (rootElement) {
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
}
</script>
</body>
</html>
